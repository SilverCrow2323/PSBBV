name: Federated node map
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate federated repository map
        run: python -m unittest discover -s tests -v
