<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="t d">
<title id="t">PSBBV application architecture</title>
<desc id="d">A layered diagram from Vita OS through application lifecycle, input and navigation, channel views, renderer and display.</desc>
<defs>
  <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d4ff43"/><stop offset="1" stop-color="#60d9ed"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#d4ff43" stroke-width="1.3"/></marker>
</defs>
<rect width="1100" height="500" rx="26" fill="#11131a"/>
<text x="55" y="48" font-family="Arial" font-size="12" font-weight="700" letter-spacing="3" fill="#d4ff43">SPDW FACTORY / PSBBV RUNTIME MAP</text>
<text x="55" y="83" font-family="Arial" font-size="27" font-weight="700" fill="#f4f2ec">Small layers. Clear jobs. No spaghetti.</text>
<g font-family="Arial" text-anchor="middle">
  <rect x="330" y="116" width="440" height="48" rx="12" fill="#29303c" stroke="#50596b"/>
  <text x="550" y="146" font-size="16" font-weight="700" fill="#f4f2ec">Vita OS / VitaSDK</text>
  <path d="M550 164 V184" stroke="#d4ff43" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="190" width="440" height="48" rx="12" fill="#29303c" stroke="#50596b"/>
  <text x="550" y="220" font-size="16" font-weight="700" fill="#f4f2ec">Application lifecycle / main loop</text>
  <path d="M550 238 V258" stroke="#d4ff43" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="264" width="440" height="48" rx="12" fill="#3e332b" stroke="#ff5c50"/>
  <text x="550" y="294" font-size="16" font-weight="700" fill="#ffe4df">Input snapshot + navigation state</text>
  <path d="M550 312 V332" stroke="#d4ff43" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="338" width="440" height="48" rx="12" fill="#35412a" stroke="#d4ff43"/>
  <text x="550" y="368" font-size="16" font-weight="700" fill="#efffc5">Channel registry + channel views</text>
  <path d="M550 386 V406" stroke="#d4ff43" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="412" width="440" height="48" rx="12" fill="#283b43" stroke="#60d9ed"/>
  <text x="550" y="442" font-size="16" font-weight="700" fill="#dcfaff">UI composition / renderer / display</text>
  <g fill="#adb4c2" font-size="12" text-anchor="start">
    <text x="795" y="207">Start / stop / cleanup</text>
    <text x="795" y="281">D-pad / buttons / touch</text>
    <text x="795" y="355">Stable IDs + honest availability</text>
    <text x="795" y="429">Draw only. No network or disk I/O.</text>
  </g>
  <g fill="#8d96a6" font-size="11" text-anchor="end">
    <text x="305" y="207">Owns runtime</text>
    <text x="305" y="281">Owns focus + route</text>
    <text x="305" y="355">Owns feature boundaries</text>
    <text x="305" y="429">Owns pixels</text>
  </g>
</g>
</svg>